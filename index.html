<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neymar Vlog - GitHub Edition</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilo do botão fixo no canto inferior direito */
        .like-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #ffffff;
            border: 2px solid #ff4b4b;
            border-radius: 50px;
            padding: 10px 18px;
            font-size: 18px;
            font-weight: bold;
            color: #ff4b4b;
            cursor: pointer;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, background-color 0.2s ease;
            z-index: 1000;
        }

        /* Efeito ao passar o mouse */
        .like-btn:hover {
            transform: scale(1.1);
            background-color: #ff4b4b;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <header>
        <h1 class="rgb-text">NEYMAR JR VLOG</h1>
        <p class="subtitle">Acompanhe os bastidores e a história do craque</p>
    </header>

    <main class="container">
        <section class="vlog-video">
            <h2 class="rgb-text">Último Episódio</h2>
            <div class="video-container">
                <iframe width="560" height="315" src="https://www.youtube.com/embed/1xl7YThk-e8" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
            </div>
        </section>

        <section class="neymar-gallery">
            <h2 class="rgb-text">Galeria do Craque</h2>
            <div class="image-container">
